name: Rung 54 Admitted SPARK Task-Quality Matrix

on:
  pull_request:
    paths:
      - ".github/workflows/rung54-spark-task-quality-matrix.yml"
      - "scripts/hosted_spark_task_matrix.py"
      - "tests/test_hosted_spark_task_matrix.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    name: evidence / task matrix contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate task matrix script
        run: |
          python3 -m py_compile scripts/hosted_spark_task_matrix.py
          python3 -m unittest discover -s tests -p "test_hosted_spark_task_matrix.py" -v

  admitted-model:
    name: model / ${{ matrix.model }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: qwen2.5:0.5b-instruct
            safe: qwen2.5-0.5b-instruct
            digest: a8b0c51577010a279d933d14c2a8ab4b268079d44c5c8830c0a93900f1827c67
          - model: llama3.2:1b
            safe: llama3.2-1b
            digest: baf6a787fdffd633537aa2eb51cfd54cb93ff08e28040095462bb63daf552878

    steps:
      - name: Checkout matrix harness
        uses: actions/checkout@v4

      - name: Checkout pinned SPARK bridge
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/SparkTheSubstrate
          ref: fae7879820bef63a550fea486b2defbc3cee5304
          path: _spark

      - name: Checkout pinned PixelForge runtime
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/parallax-pixelforge
          ref: 8790c3b00b5184136fb8fa6a2fbdabe834eeca22
          path: _pixelforge

      - name: Checkout merged PhiCade Rung 53
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/PhiCade
          ref: 4cb2d55a8673618ad8cc5b168de096ec899d2c3d
          path: _phicade

      - name: Retrieve actual Rung 51 isolated admission evidence
        uses: actions/download-artifact@v4
        with:
          name: phicade-spark-isolated-model-identity-matrix-rung51
          run-id: 37673671800
          github-token: ${{ github.token }}
          repository: MichaelWave369/SparkTheSubstrate
          path: _admission_source

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install bounded native dependencies
        timeout-minutes: 8
        run: |
          sudo timeout 180s apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo timeout 240s apt-get install -y \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Build exact PhiCade harness and evidence scorers
        working-directory: _phicade
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --example qualify_spark_ollama
          cargo build -p phicade-runtime --example qualify_model_admission --example score_spark_playtest

      - name: Convert Rung 51 evidence into governed admission set
        run: |
          mkdir -p "_trials/${{ matrix.safe }}"
          "$GITHUB_WORKSPACE/_phicade/target/debug/examples/qualify_model_admission" \
            --input "$GITHUB_WORKSPACE/_admission_source/rung51-model-identity-matrix.json" \
            --out "$GITHUB_WORKSPACE/_trials/${{ matrix.safe }}/admissions.json"

      - name: Install Ollama on isolated runner
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start isolated Ollama
        run: |
          nohup ollama serve > "_trials/${{ matrix.safe }}/ollama.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              exit 0
            fi
            sleep 1
          done
          cat "_trials/${{ matrix.safe }}/ollama.log" || true
          exit 1

      - name: Pull admitted model only
        run: |
          ollama pull "${{ matrix.model }}"
          ollama list

      - name: Run identical frozen tasks twice each
        run: |
          python3 scripts/hosted_spark_task_matrix.py run \
            --model "${{ matrix.model }}" \
            --digest "${{ matrix.digest }}" \
            --admissions "$GITHUB_WORKSPACE/_trials/${{ matrix.safe }}/admissions.json" \
            --phicade "$GITHUB_WORKSPACE/_phicade" \
            --pixelforge "$GITHUB_WORKSPACE/_pixelforge" \
            --spark "$GITHUB_WORKSPACE/_spark" \
            --out "$GITHUB_WORKSPACE/_trials/${{ matrix.safe }}"

      - name: Preserve model task evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rung54-${{ matrix.safe }}
          path: _trials/${{ matrix.safe }}/**
          if-no-files-found: warn

  aggregate:
    name: evidence / freeze task-quality matrix
    runs-on: ubuntu-latest
    needs: [contract, admitted-model]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download model results
        uses: actions/download-artifact@v4
        with:
          pattern: rung54-*
          path: _collected
          merge-multiple: false

      - name: Aggregate without granting routing authority
        run: |
          python3 scripts/hosted_spark_task_matrix.py aggregate \
            --input "_collected" --out "_matrix"

      - name: Publish summary
        if: always()
        run: |
          if [[ -f "_matrix/task-quality-matrix.md" ]]; then
            cat "_matrix/task-quality-matrix.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve final matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rung54-spark-task-quality-matrix
          path: _matrix/**
          if-no-files-found: warn

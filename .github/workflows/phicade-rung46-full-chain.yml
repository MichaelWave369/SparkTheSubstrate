name: PhiCade Rung 46 Full Chain

on:
  pull_request:
    paths:
      - ".github/workflows/phicade-rung46-full-chain.yml"
  workflow_dispatch:

jobs:
  qualify:
    name: runtime / PhiCade -> PixelForge -> SPARK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned SPARK bridge source
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/SparkTheSubstrate
          ref: fae7879820bef63a550fea486b2defbc3cee5304
          path: _spark

      - name: Checkout pinned PixelForge v5.34
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/parallax-pixelforge
          ref: 8790c3b00b5184136fb8fa6a2fbdabe834eeca22
          path: _pixelforge

      - name: Checkout PhiCade Rung 46 candidate
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/PhiCade
          ref: 37a6fe0751f02255339ecce2e0f92be3985711a6
          path: _phicade

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Run full three-project qualification
        working-directory: _phicade
        run: bash ./scripts/qualify-spark-chain.sh "$GITHUB_WORKSPACE/_pixelforge" "$GITHUB_WORKSPACE/_spark"

      - uses: actions/upload-artifact@v4
        with:
          name: phicade-pixelforge-spark-rung46
          path: _phicade/artifacts/phicade-pixelforge-spark-qualification.json
          if-no-files-found: error
